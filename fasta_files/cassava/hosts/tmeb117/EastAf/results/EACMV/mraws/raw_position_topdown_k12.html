<script>
    'use strict';
    const data = JSON.parse(document.getElementById('raw-data').textContent);
    const canvas = document.getElementById('plot'), ctx = canvas.getContext('2d'), tip = document.getElementById('tip');
    const margin = { left: 80, right: 25, top: 25, bottom: 65 }; let width, height, view, drag = null, bins = new Map();
    const groups = new Map();
    for (const row of data.rows) { const key = row[0] + ',' + row[1]; if (!groups.has(key)) groups.set(key, []); groups.get(key).push(row); }
    document.getElementById('count').textContent = data.rows.length.toLocaleString() + ' ' + data.label + ' occurrences';
    function reset() { view = { x0: 0, x1: data.xmax, y0: -0.5, y1: data.ymax + 0.5 }; draw(); }
    function px(x) { return margin.left + (x - view.x0) / (view.x1 - view.x0) * (width - margin.left - margin.right); }
    function py(y) { return height - margin.bottom - (y - view.y0) / (view.y1 - view.y0) * (height - margin.top - margin.bottom); }
    function step(span) { const base = 10 ** Math.floor(Math.log10(span / 10)); return [1, 2, 5, 10].map(v => v * base).find(v => v >= span / 10); }
    function draw() {
        ctx.clearRect(0, 0, width, height); ctx.font = '12px system-ui'; ctx.fillStyle = '#333'; ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1;
        for (let axis = 0; axis < 2; axis++) {
            const low = axis ? view.y0 : view.x0, high = axis ? view.y1 : view.x1, inc = Math.max(1, step(high - low));
            for (let v = Math.ceil(low / inc) * inc; v <= high; v += inc) {
                ctx.beginPath();
                if (axis) { const y = py(v); ctx.moveTo(margin.left, y); ctx.lineTo(width - margin.right, y); ctx.textAlign = 'right'; ctx.fillText(Math.round(v).toLocaleString(), margin.left - 8, y + 4); }
                else { const x = px(v); ctx.moveTo(x, margin.top); ctx.lineTo(x, height - margin.bottom); ctx.textAlign = 'center'; ctx.fillText(Math.round(v).toLocaleString(), x, height - margin.bottom + 22); }
                ctx.stroke();
            }
        }
        ctx.textAlign = 'center'; ctx.fillText('Position in Genome', width / 2, height - 15); ctx.save(); ctx.translate(18, height / 2); ctx.rotate(-Math.PI / 2); ctx.fillText('Genome Index', 0, 0); ctx.restore();
        bins = new Map(); ctx.save(); ctx.beginPath(); ctx.rect(margin.left, margin.top, width - margin.left - margin.right, height - margin.top - margin.bottom); ctx.clip();
        for (const rows of groups.values()) {
            const row = rows[0], x = px(row[0]), y = py(row[1]); if (x < margin.left || x > width - margin.right || y < margin.top || y > height - margin.bottom) continue;
            ctx.fillStyle = data.color; ctx.beginPath(); ctx.arc(x, y, 2.5, 0, 2 * Math.PI); ctx.fill();
            if (data.highlight && rows.some(r => r[3] >= 48 && r[3] <= 52)) { ctx.strokeStyle = 'orange'; ctx.beginPath(); ctx.arc(x, y, 6, 0, 2 * Math.PI); ctx.stroke(); }

    }
    function locate(e) { const rect = canvas.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; }

        for (let x = bx - 1; x <= bx + 1; x++)for (let y = by - 1; y <= by + 1; y++)for (const point of bins.get(x + ',' + y) || []) { const d = (point.x - p.x) ** 2 + (point.y - p.y) ** 2; if (d < distance) { best = point; distance = d; } }
        return best;
    }
    function inspect(point) {
        const container = document.getElementById('details'); container.replaceChildren(); if (!point) return;
        const heading = document.createElement('p'); heading.textContent = point.rows.length + ' occurrence(s) at position ' + point.rows[0][0] + ', genome ' + point.rows[0][1]; container.append(heading);
        const table = document.createElement('table'), head = document.createElement('tr'); for (const name of ['Sequence', 'Position', 'Genome index', 'GC %', 'k']) { const cell = document.createElement('th'); cell.textContent = name; head.append(cell); } table.append(head);
        for (const row of point.rows) { const tr = document.createElement('tr'); for (const [i, value] of [row[2], row[0], row[1], row[3], row[4]].entries()) { const cell = document.createElement('td'); cell.textContent = value; if (i === 0) cell.className = 'seq'; tr.append(cell); } table.append(tr); } container.append(table);
    }
    canvas.addEventListener('pointerdown', e => { drag = { start: locate(e), view: { ...view }, moved: false }; canvas.setPointerCapture(e.pointerId); tip.style.display = 'none'; });
    canvas.addEventListener('pointermove', e => {
        const p = locate(e); if (drag) {
            const dx = p.x - drag.start.x, dy = p.y - drag.start.y; if (Math.hypot(dx, dy) > 3) drag.moved = true;
            if (drag.moved) { const sx = (drag.view.x1 - drag.view.x0) / (width - margin.left - margin.right), sy = (drag.view.y1 - drag.view.y0) / (height - margin.top - margin.bottom); view = { x0: drag.view.x0 - dx * sx, x1: drag.view.x1 - dx * sx, y0: drag.view.y0 + dy * sy, y1: drag.view.y1 + dy * sy }; draw(); } return;
        }
        const point = hit(p); tip.style.display = point ? 'block' : 'none'; if (point) { const r = point.rows[0]; tip.textContent = r[2] + '\nPosition: ' + r[0] + ' | Genome: ' + r[1] + '\nGC: ' + r[3] + '% | k: ' + r[4] + (point.rows.length > 1 ? '\n' + point.rows.length + ' overlapping occurrences — click to list' : ''); tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = Math.max(0, Math.min(e.clientY + 12, window.innerHeight - tip.offsetHeight - 8)) + 'px'; }
    });
    canvas.addEventListener('pointerup', e => { if (drag && !drag.moved) inspect(hit(locate(e))); drag = null; });
    canvas.addEventListener('pointercancel', () => { drag = null; }); canvas.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
    canvas.addEventListener('wheel', e => {
        e.preventDefault(); tip.style.display = 'none'; const p = locate(e), factor = Math.exp(Math.max(-1, Math.min(1, e.deltaY * 0.002)));

        if ((view.x1 - view.x0) * factor < 1 || (view.y1 - view.y0) * factor < 0.1) return;
        view = { x0: x + (view.x0 - x) * factor, x1: x + (view.x1 - x) * factor, y0: y + (view.y0 - y) * factor, y1: y + (view.y1 - y) * factor }; draw();
    }, { passive: false });
    document.getElementById('reset').onclick = reset;
    function resize() { const rect = canvas.getBoundingClientRect(), ratio = window.devicePixelRatio || 1; width = rect.width; height = rect.height; canvas.width = Math.round(width * ratio); canvas.height = Math.round(height * ratio); ctx.setTransform(ratio, 0, 0, ratio, 0, 0); if (view) draw(); else reset(); }
    window.addEventListener('resize', resize); resize();
